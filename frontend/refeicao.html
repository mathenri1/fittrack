
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Refeições - FitTrack</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Registrar Refeição</h1>

      <nav>
        <a href="index.html">Início</a> |
        <a href="treino.html">Treinos</a> |
        <a href="refeicao.html">Refeições</a>
      </nav>

      <form id="formRefeicao">
        <label>Descrição:</label>
        <input type="text" id="descricao" placeholder="Ex: frango com arroz e salada">

        <label>Proteína (g):</label>
        <input type="number" id="proteina" step="0.01" min="0" placeholder="40">

        <label>Carboidrato (g):</label>
        <input type="number" id="carbo" step="0.01" min="0" placeholder="60">

        <label>Gordura (g):</label>
        <input type="number" id="gordura" step="0.01" min="0" placeholder="10">

        <button type="submit">Salvar</button>
      </form>

      <h2>Lista de Refeições</h2>
      <ul id="listaRefeicoes"></ul>
    </div>
  </div>
</body>
</html>
