<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Treinos - FitTrack</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Registrar Treino</h1>
      <nav>
        <a href="index.html">Início</a> |
        <a href="treino.html">Treinos</a> |
        <a href="refeicao.html">Refeições</a>
      </nav>

      <form id="formTreino">
        <label>Observações:</label>
        <input type="text" id="observacoes" placeholder="Ex: treino de peito e tríceps">

        <label>Percepção de Esforço (1-10):</label>
        <input type="number" id="esforco" min="1" max="10" placeholder="7">

        <button type="submit">Salvar</button>
      </form>

      <h2>Lista de Treinos</h2>
      <ul id="listaTreinos"></ul>
    </div>
  </div>
</body>
</html>
